name: Build ARM64 Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx6g
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true

jobs:
  build-arm64-debug:
    name: Build GMS ARM64 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ARM64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGmsMobileArm64Debug --no-daemon --build-cache --stacktrace --console=plain

      - name: Locate APK and create checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          if [[ -z "$apk" ]]; then
            echo 'No ARM64 debug APK was produced.' >&2
            find app/build/outputs/apk -maxdepth 8 -type f -print || true
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          sha256sum "$apk" > "$apk.sha256"
          echo "APK: $apk"
          cat "$apk.sha256"

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: frostsoulx-2-arm64-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: frostsoulx-2-arm64-debug-checksum
          path: ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14
